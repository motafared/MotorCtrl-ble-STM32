<!DOCTYPE html>
<html lang="en" data-version="1.2.0">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MotorCtrl Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

<!-- Top bar -->
<header class="border-b border-slate-700 bg-slate-800/60 backdrop-blur">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-4">
    <h1 class="text-lg font-semibold flex-1">MotorCtrl Dashboard
      <span id="app-version" class="ml-1 text-[10px] font-normal text-slate-500 tabular-nums align-middle"></span>
    </h1>
    <span id="status" class="px-3 py-1 text-xs rounded-full bg-slate-700 text-slate-300">Disconnected</span>
    <button id="btn-connect" class="px-4 py-1.5 text-sm rounded-md bg-emerald-600 hover:bg-emerald-500 font-medium">
      Connect
    </button>
  </div>
</header>

<main class="max-w-5xl mx-auto p-4 space-y-4">

  <!-- Board card -->
  <section class="rounded-xl bg-slate-800 border border-slate-700 shadow p-4 space-y-4">
    <div class="flex items-center gap-3">
      <!-- Editable board name (Option A: stored in the dashboard, labels CSV exports) -->
      <input id="board-name" type="text" maxlength="32" title="Board name — used in CSV exports"
             class="font-semibold bg-transparent border border-transparent hover:border-slate-600 focus:border-sky-500 focus:bg-slate-900/60 rounded px-1 py-0.5 w-40 outline-none" />
      <span id="state-chip" class="px-2.5 py-0.5 text-xs rounded-full bg-slate-700 text-slate-300">Idle</span>
    </div>

    <!-- Motors grid -->
    <div class="grid sm:grid-cols-2 gap-3">
      <!-- M1 -->
      <div class="rounded-lg bg-slate-900/60 border border-slate-700 p-3">
        <div class="text-xs uppercase tracking-wide text-slate-400">Motor 1</div>
        <div class="mt-1 flex items-baseline gap-2">
          <span id="asm1" class="text-4xl font-bold tabular-nums text-sky-400">0</span>
          <span class="text-sm text-slate-400">RPM</span>
        </div>
        <div class="mt-3 flex items-center gap-2">
          <label class="text-xs text-slate-400 w-16">Target</label>
          <input id="tsm1-in" type="number" min="0" max="3000" step="10"
                 class="w-24 px-2 py-1 bg-slate-800 border border-slate-600 rounded text-sm" />
          <button id="tsm1-set" class="px-3 py-1 text-xs rounded bg-sky-600 hover:bg-sky-500">Set</button>
        </div>
        <div class="mt-2 text-xs text-slate-400">
          Rotations: <span id="rm1" class="text-slate-200 tabular-nums">0</span>
        </div>
      </div>
      <!-- M2 -->
      <div class="rounded-lg bg-slate-900/60 border border-slate-700 p-3">
        <div class="text-xs uppercase tracking-wide text-slate-400">Motor 2</div>
        <div class="mt-1 flex items-baseline gap-2">
          <span id="asm2" class="text-4xl font-bold tabular-nums text-amber-500">0</span>
          <span class="text-sm text-slate-400">RPM</span>
        </div>
        <div class="mt-3 flex items-center gap-2">
          <label class="text-xs text-slate-400 w-16">Target</label>
          <input id="tsm2-in" type="number" min="0" max="3000" step="10"
                 class="w-24 px-2 py-1 bg-slate-800 border border-slate-600 rounded text-sm" />
          <button id="tsm2-set" class="px-3 py-1 text-xs rounded bg-sky-600 hover:bg-sky-500">Set</button>
        </div>
        <div class="mt-2 text-xs text-slate-400">
          Rotations: <span id="rm2" class="text-slate-200 tabular-nums">0</span>
        </div>
      </div>
    </div>

    <!-- Cycle time + elapsed -->
    <div class="grid sm:grid-cols-2 gap-3">
      <div class="rounded-lg bg-slate-900/60 border border-slate-700 p-3 flex items-center gap-2">
        <label class="text-xs text-slate-400 w-20">Cycle (s)</label>
        <input id="ct-in" type="number" min="1" max="600" step="1"
               class="w-24 px-2 py-1 bg-slate-800 border border-slate-600 rounded text-sm" />
        <button id="ct-set" class="px-3 py-1 text-xs rounded bg-sky-600 hover:bg-sky-500">Set</button>
      </div>
      <div class="rounded-lg bg-slate-900/60 border border-slate-700 p-3 flex items-center gap-3">
        <span class="text-xs uppercase tracking-wide text-slate-400">Elapsed</span>
        <span id="et" class="text-2xl font-bold tabular-nums">00:00</span>
      </div>
    </div>

    <!-- Action row -->
    <div class="flex flex-wrap gap-2">
      <button id="btn-start-timed" class="px-4 py-2 text-sm rounded-md bg-emerald-600 hover:bg-emerald-500 font-medium">
        Start Timed
      </button>
      <button id="btn-start-cont" class="px-4 py-2 text-sm rounded-md bg-amber-600 hover:bg-amber-500 font-medium">
        Start Continuous
      </button>
      <button id="btn-stop" class="px-4 py-2 text-sm rounded-md bg-rose-600 hover:bg-rose-500 font-medium">
        Stop
      </button>
    </div>
  </section>

  <!-- Live chart -->
  <section class="rounded-xl bg-slate-800 border border-slate-700 shadow p-4">
    <div class="flex items-center gap-3 mb-2">
      <h2 class="font-semibold flex-1">Live Speed</h2>
      <button id="chart-pause" class="px-3 py-1 text-xs rounded bg-slate-700 hover:bg-slate-600">Pause</button>
      <button id="chart-clear" class="px-3 py-1 text-xs rounded bg-slate-700 hover:bg-slate-600">Clear</button>
    </div>
    <div class="chart-container">
      <canvas id="chart"></canvas>
    </div>
  </section>

  <!-- Log -->
  <section class="rounded-xl bg-slate-800 border border-slate-700 shadow">
    <details open>
      <summary class="cursor-pointer px-4 py-2 text-sm font-medium select-none flex items-center justify-between">
        <span>Log</span>
        <span class="flex gap-2">
          <button id="log-export" class="px-3 py-1 text-xs rounded bg-slate-700 hover:bg-slate-600">Export</button>
          <button id="log-clear" class="px-3 py-1 text-xs rounded bg-slate-700 hover:bg-slate-600">Clear</button>
        </span>
      </summary>
      <pre id="log" class="px-4 pb-3 text-xs text-slate-400 font-mono whitespace-pre-wrap max-h-48 overflow-auto"></pre>
    </details>
  </section>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
